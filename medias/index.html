<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <meta content="Médias et ressources audiovisuelles de la Présidence de la République démocratique du Congo." name="description"/>
  <title>Médias — Présidence de la République</title>
  <link href="./style.css" rel="stylesheet"/>
  <link href="../rdc.css" rel="stylesheet"/>
</head>
<body>
  <div data-site-header></div>

  <main class="media-page" aria-label="Médias de la Présidence">
    <section class="media-mosaic">

      <div class="media-mosaic__side media-mosaic__side--left">
        <a class="media-tile media-tile--small" href="/ressources/galerie/" aria-label="Accéder à la galerie photo">
          <img src="/assets/media/galerie-photo.jpg" alt="" />
          <span class="media-tile__shade" aria-hidden="true"></span>
          <span class="media-tile__content">
            <strong>Galerie photo</strong>
            <span class="media-tile__arrow" aria-hidden="true">→</span>
          </span>
        </a>

        <a class="media-tile media-tile--large-side" href="/ressources/lpda/" aria-label="Accéder au Peuple d’abord">
          <img src="/assets/media/le-peuple-dabord.jpg" alt="" />
          <span class="media-tile__shade" aria-hidden="true"></span>
          <span class="media-tile__content">
            <strong>Le Peuple d’abord</strong>
            <span class="media-tile__arrow" aria-hidden="true">→</span>
          </span>
        </a>
      </div>

      <a class="media-tile media-tile--featured" href="/ressources/video/" aria-label="Accéder à la vidéothèque">
        <img src="/assets/media/videotheque.jpg" alt="" />
        <span class="media-tile__shade" aria-hidden="true"></span>
        <span class="media-tile__content">
          <strong>Vidéothèque</strong>
          <span class="media-tile__arrow" aria-hidden="true">→</span>
        </span>
      </a>

      <div class="media-mosaic__side media-mosaic__side--right">
        <a class="media-tile media-tile--large-side" href="/ressources/discours/" aria-label="Accéder aux discours">
          <img src="/assets/media/discours.jpg" alt="" />
          <span class="media-tile__shade" aria-hidden="true"></span>
          <span class="media-tile__content">
            <strong>Discours</strong>
            <span class="media-tile__arrow" aria-hidden="true">→</span>
          </span>
        </a>

        <a class="media-tile media-tile--small" href="/documents/" aria-label="Accéder aux documents officiels">
          <img src="/assets/media/documents-officiels.jpg" alt="" />
          <span class="media-tile__shade" aria-hidden="true"></span>
          <span class="media-tile__content">
            <strong>Documents officiels</strong>
            <span class="media-tile__arrow" aria-hidden="true">→</span>
          </span>
        </a>
      </div>

    </section>
  </main>

  <div data-site-footer></div>

  <script defer src="../site-shell.js"></script>
  <script defer src="../rdc.js"></script>
</body>
</html>
