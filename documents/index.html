<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Documents institutionnels de la Présidence de la République démocratique du Congo.">
  <title>Documents — Présidence de la République</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../rdc.css">
</head>
<body>
  <div data-site-header></div>

  <main class="documents-page">
    <section class="documents-shell" aria-labelledby="documents-title">
      <header class="documents-head">
        <h1 id="documents-title">Documents</h1>
      </header>

      <div class="documents-grid">
        <a class="document-card" href="../ressources/discours/" aria-label="Discours">
          <span class="document-card__frame">
            <span class="document-cover">
              <span class="document-cover__topline"></span>
              <span class="document-cover__title">Discours</span>
              <span class="document-cover__bottomline"></span>
              <span class="document-cover__flag" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
          </span>
        </a>

        <a class="document-card" href="./annuaire/" aria-label="Annuaire du leadership féminin en RDC">
          <span class="document-card__frame">
            <span class="document-cover">
              <span class="document-cover__topline"></span>
              <span class="document-cover__title document-cover__title--small">Annuaire<br>du leadership<br>féminin en RDC</span>
              <span class="document-cover__bottomline"></span>
              <span class="document-cover__flag" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
          </span>
        </a>

        <a class="document-card" href="../ressources/ordonnances/" aria-label="Ordonnances">
          <span class="document-card__frame">
            <span class="document-cover">
              <span class="document-cover__topline"></span>
              <span class="document-cover__title">Ordonnances</span>
              <span class="document-cover__bottomline"></span>
              <span class="document-cover__flag" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
          </span>
        </a>

        <a class="document-card" href="../conseil-de-ministres/" aria-label="Conseil des Ministres">
          <span class="document-card__frame">
            <span class="document-cover">
              <span class="document-cover__topline"></span>
              <span class="document-cover__title document-cover__title--small">Conseil<br>des Ministres</span>
              <span class="document-cover__bottomline"></span>
              <span class="document-cover__flag" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
          </span>
        </a>

        <a class="document-card" href="../textes-fondateurs/" aria-label="Les autres Constitutions">
          <span class="document-card__frame">
            <span class="document-cover">
              <span class="document-cover__topline"></span>
              <span class="document-cover__title document-cover__title--small">Les autres<br>Constitutions</span>
              <span class="document-cover__bottomline"></span>
              <span class="document-cover__flag" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
          </span>
        </a>

        <a class="document-card" href="../ressources/lpda/" aria-label="LPDA — Le peuple d’abord">
          <span class="document-card__frame">
            <span class="document-cover">
              <span class="document-cover__topline"></span>
              <span class="document-cover__title document-cover__title--small">LPDA<br>Le peuple<br>d’abord</span>
              <span class="document-cover__bottomline"></span>
              <span class="document-cover__flag" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script defer src="../site-shell.js"></script>
  <script defer src="../rdc.js"></script>
</body>
</html>
