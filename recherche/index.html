<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <meta content="Recherchez sur le portail de la Présidence de la République Démocratique du Congo." name="description"/>
  <title>Recherche — Présidence de la République</title>
  <link href="../rdc.css" rel="stylesheet"/>
  <link href="./style.css" rel="stylesheet"/>
</head>
<body data-page="recherche">
  <div data-site-header></div>
  <main class="search-only-page">
    <section class="search-only-shell">
      <form class="portal-search" id="portal-search-form" role="search" autocomplete="off">
        <div class="portal-search__control">
          <svg class="portal-search__icon" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 5 5"></path>
          </svg>
          <input id="portal-search-input" type="search" aria-label="Recherche" placeholder="Que recherchez-vous ?"/>
          <button type="submit" aria-label="Rechercher" title="Rechercher">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="m15.5 15.5 5 5"></path>
            </svg>
          </button>
        </div>
      </form>
      <section class="search-results-wrap" id="search-results-wrap" hidden aria-live="polite">
        <p class="search-count" id="search-count"></p>
        <div class="search-results" id="search-results"></div>
        <div class="search-empty" id="search-empty" hidden>
          <h2>Aucun résultat trouvé</h2>
          <p>Essayez avec un autre mot-clé.</p>
        </div>
      </section>
    </section>
  </main>
  <div data-site-footer></div>
  <script defer src="../site-shell.js"></script>
  <script defer src="./search-data.js"></script>
  <script defer src="./script.js"></script>
  <script defer src="../rdc.js"></script>
</body>
</html>
